<div class="chat-widget-container" [class.chat-open]="isOpen">
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <div class="header-content">
        <div class="bot-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          <div class="online-indicator"></div>
        </div>
        <div class="header-text">
          <h3>{{ portfolioName }} Assistant</h3>
          <p>AI Agent &bull; Online</p>
        </div>
      </div>
      <button class="settings-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div class="chat-messages" #scrollMe>
      <div *ngFor="let msg of messages" 
           class="message-wrapper" 
           [class.user-message-wrapper]="msg.sender === 'user'"
           [class.bot-message-wrapper]="msg.sender === 'bot'">
        
        <div class="message-bubble" 
             [class.user-bubble]="msg.sender === 'user'"
             [class.bot-bubble]="msg.sender === 'bot'">
          {{ msg.text }}
        </div>
        <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>

      <div class="message-wrapper bot-message-wrapper" *ngIf="isTyping">
        <div class="message-bubble bot-bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="quick-replies" *ngIf="messages.length < 3 && !isTyping">
      <button *ngFor="let qr of quickReplies" 
              class="quick-reply-btn"
              (click)="sendMessage(qr)">
        {{ qr }}
      </button>
    </div>

    <div class="chat-input-area">
      <input type="text" 
             [(ngModel)]="newMessage" 
             (keyup.enter)="sendMessage()" 
             placeholder="Ask me a question..."
             class="chat-input">
      <button class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </div>

  <button class="fab" (click)="toggleChat()">
    <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>
    <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
</div>
